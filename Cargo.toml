[workspace]
resolver = "2"
members = ["module", "roundtrip_latency_test", "experiment_module", "experiment_harness"]

[workspace.dependencies]
spacetimedb = "=2.7.0"
spacetimedb-sdk = "=2.7.0"
# Pinned to the exact version the SDK already resolves transitively, and depended on for one
# reason: `prometheus::core::Metric` is the only public door to `HistogramCore::proto`, whose
# shard flip and drain is the sole coherent read of a histogram's sample count and byte sum.
prometheus = "=0.14.0"
# Pinned to the version already locked transitively under the SDK, so this direct dependency adds no
# new source. Depended on for one call: `sysconf(_SC_PAGESIZE)`, since `/proc/vmstat` counts
# `pswpout` in pages while the environment sample records bytes. Default features only.
libc = "=0.2.180"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
