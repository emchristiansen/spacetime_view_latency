[workspace]
resolver = "2"
members = ["module", "roundtrip_latency_test", "experiment_module", "experiment_harness"]

[workspace.dependencies]
spacetimedb = "=2.7.0"
spacetimedb-sdk = "=2.7.0"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
